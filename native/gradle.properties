org.gradle.caching=true
org.gradle.parallel=true

# D8 merges the Compose dex archives inside the Gradle daemon, and on the
# default heap it dies with OutOfMemoryError partway through
# :app:mergeExtDexDebug. Compose is a lot of classes.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Capped explicitly, and its own process: the build log warned about multiple
# Kotlin daemon sessions, which with parallel execution means several unbounded
# JVMs competing with the one doing the dexing.
kotlin.daemon.jvmargs=-Xmx2g
kotlin.code.style=official

# Required by every AndroidX dependency, which is all of Compose. Without it
# :app:checkDebugAarMetadata fails outright rather than warning.
android.useAndroidX=true

# Applies to :app, the only Android module.
android.nonTransitiveRClass=true
