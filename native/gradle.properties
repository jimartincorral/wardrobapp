org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Required by every AndroidX dependency, which is all of Compose. Without it
# :app:checkDebugAarMetadata fails outright rather than warning.
android.useAndroidX=true

# The pure modules do not need this; it applies to :app, which is the only
# Android module and is only included when an SDK is present.
android.nonTransitiveRClass=true
