# Which Android version these tests run against.
#
# Pinned, and deliberately not targetSdk. Robolectric emulates a fixed set of
# API levels and needs a downloaded runtime for each; asked for one it has no
# runtime for -- which targetSdk 36 is, for Robolectric 4.16.1 -- it fails
# before any test body runs, with an UnsupportedOperationException from its SDK
# provider rather than anything about the test.
#
# 34 rather than the newest it supports, because what these tests assert -- which
# file a path resolves to, and that a directory gets created -- does not vary by
# API level, and a version that has been supported for years will not start
# failing when this file is forgotten about. Raising targetSdk needs no change
# here; if a future test does depend on newer platform behaviour, that test can
# override this with @Config(sdk = ...).
sdk=34
