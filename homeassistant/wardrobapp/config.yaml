# The Home Assistant app: the wardrobe server and the browser app, as one
# container that Home Assistant runs and shows in its sidebar.
#
# Kept honest by HomeAssistantAppTest in :server, which reads this file, the
# Dockerfile beside it and the workflow that builds the images, and fails when
# they disagree with each other or with the server -- a port, an architecture
# or an address that differs between two of them is an app that installs and
# then shows nothing.
name: Wardrobapp
# What Home Assistant compares to decide whether there is an update, and the
# tag of the image it pulls. The images are built by .github/workflows/
# home-assistant.yml when this changes on main; bumping it is releasing.
version: "0.1.0"
slug: wardrobapp
description: Your wardrobe and outfit ideas, kept in Home Assistant.
url: https://github.com/jimartincorral/wardrobapp
# amd64 for Intel and AMD machines, aarch64 for 64-bit ARM: a Raspberry Pi 4 or
# 5, Home Assistant Green and Yellow. Not armv7 -- 32-bit ARM's Java runtimes
# lag, and the images would need a base of their own.
arch:
  - aarch64
  - amd64
# Prebuilt, one image per architecture; {arch} is filled in by Home Assistant.
image: ghcr.io/jimartincorral/wardrobapp-{arch}
# 2024.1 as a floor: nothing here needs a newer Home Assistant, and an older
# one is old enough not to be worth answering for.
homeassistant: "2024.1.0"
startup: application
boot: auto
# The image's own entry point runs the server; Home Assistant's init system has
# nothing to supervise.
init: false
# Through Home Assistant only. No `ports`: nothing is published on the host,
# and ingress, which checks who is signed in, is the one way in. The server
# also refuses any request that does not come from ingress's address; see the
# Dockerfile.
ingress: true
ingress_port: 8099
panel_icon: mdi:hanger
panel_title: Wardrobe
