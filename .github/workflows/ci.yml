name: CI

on:
  pull_request:
  push:
    # Development branches too, not just main: the Android job is the only place
    # :app can be compiled or linted at all, and a branch should be able to prove
    # itself before a pull request exists to run it. The cost is that a branch
    # with an open pull request runs twice.
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three pure Kotlin modules: the algorithms, the mapping layer and the view
  # logic. Deliberately with no SDK on the path -- settings.gradle.kts then
  # excludes :app, so this job tests only the modules that need nothing but a
  # JDK, and in doing so proves they genuinely need nothing but a JDK. That
  # property is what keeps most of this codebase testable in seconds.
  kotlin:
    name: Kotlin tests
    runs-on: ubuntu-latest

    steps:
      # Whole history, not the default single commit: the release published below
      # carries a changelog, and a changelog is a range of commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test --console=plain
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""

  # The app itself. Everything that needs the Android SDK happens here, and
  # nothing here needs an emulator: the Compose tests are Robolectric ones.
  android:
    name: Build the app
    runs-on: ubuntu-latest

    # Needed to publish the release below. The repository default is read-only;
    # a workflow may request more for itself.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # The debug variant by name, not `:app:test`, which would also run these
      # against release. They cannot run there: `ui-test-manifest` supplies the
      # activity the Compose tests compose into and Google ships it as a
      # debug-only artifact, on purpose -- so in release there is no activity to
      # launch and all of them fail at once. Nothing in these tests is
      # variant-dependent, so debug is the whole story.
      - name: Test
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # Every check lint has, with warnings failing the build. There is no
      # baseline file: the backlog was cleared rather than frozen.
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      # Every finding on one line each, since a warning now fails the build and
      # the full report is mostly explanation. Information too: the version
      # checks are downgraded to it rather than switched off, and this is where
      # they get read. `if: always()`, because the run that matters most is the
      # one where lint failed.
      - name: Show the lint findings
        if: always()
        run: |
          report=app/build/reports/lint-results-debug.txt
          [ -f "$report" ] || exit 0
          grep -E '^/.*(Warning|Error|Information):' "$report" \
            | sed "s|$PWD/||" || true
          tail -1 "$report"

      # Signing is opt-in on the secret. Without it the release build is signed
      # with the committed `app/debug.keystore` -- the key every published build
      # of this app has carried, which is what keeps a release an upgrade of the
      # app people have installed rather than a collision with it. See the
      # `signingConfigs` block in app/build.gradle.kts.
      - name: Decode the release keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No ANDROID_KEYSTORE_BASE64 secret is set, so this build is signed with the committed public key -- which is what the installed app is signed with.'
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          # Gradle turns ORG_GRADLE_PROJECT_<name> into project property <name>.
          #
          # Set only when a keystore is actually present: an empty value still
          # makes the property readable, which would select the release signing
          # config and then fail on a keystore path of "".
          {
            echo "ORG_GRADLE_PROJECT_WARDROBAPP_STORE_FILE=release.keystore"
            echo "ORG_GRADLE_PROJECT_WARDROBAPP_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_WARDROBAPP_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_WARDROBAPP_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: ./gradlew :app:assembleRelease --console=plain

      # The check the upgrade path rests on. An app can only be replaced by a
      # build signed with the same key, so a release signed with something else
      # is not an update of the installed app -- it is a build that every phone
      # refuses, discovered at install time by whoever tried.
      #
      # With no keystore configured the APK must carry the committed key, and
      # the expected fingerprint is read out of that keystore rather than
      # written down here, so the two cannot drift. With one configured the
      # requirement inverts: it must *not* be the public key any more.
      - name: Check the APK is signed with the expected key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo '::warning::apksigner was not found on the runner, so the signing certificate could not be checked.'
            exit 0
          fi

          "$APKSIGNER" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk > certs.txt
          cat certs.txt

          actual=$(grep -io 'SHA-256 digest: [0-9a-f]*' certs.txt | head -1 | awk '{print $NF}')

          if [ '${{ steps.signing.outputs.signed }}' = 'true' ]; then
            if grep -q 'CN=Android Debug' certs.txt; then
              echo '::error::A keystore was configured but the APK carries the public debug key.'
              exit 1
            fi
            exit 0
          fi

          expected=$(keytool -list -v -keystore app/debug.keystore -storepass android \
            | grep -m1 'SHA256:' | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')

          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is signed with $actual, not with the key the installed app trusts ($expected)."
            exit 1
          fi
          echo "Signed with the installed base's key ($expected)."

      # Kept alongside the release below: artifacts give a per-run history, the
      # release gives one permanent link to the newest build.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardrobapp-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Publishes to a rolling `nightly` release so the download URL never
      # changes. Recreated rather than updated so the tag follows main instead
      # of pointing at whichever commit first created it.
      - name: Publish APK to the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk wardrobapp.apk

          {
            echo "Automatic build of main — run #${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
            echo
            echo "Installs over the version already on the phone, keeping the wardrobe."
            echo
            if [ "$SIGNED" = 'true' ]; then
              echo "Signed with the project's own release key. If the install is refused,"
              echo "the phone is holding a build signed with the older public key: back up"
              echo "from inside the app, uninstall, install this, restore."
            else
              echo "**Signed with a public key** — the one every build of this app has"
              echo "carried. It is what makes the upgrade work, and it means anybody could"
              echo "sign a build claiming to be this one, so trust the source rather than"
              echo "the signature."
            fi
          } > release-notes.md

          # What the app reads to know a newer build exists. Published beside
          # the APK it describes, at an address that never changes.
          #
          # The changelog is the range between the build this replaces and this one,
          # which is why the previous document is fetched before the release is
          # deleted: it is the only record of which commit was last published.
          # First-parent, so the list is one line per merge rather than every commit
          # inside each one.
          previous=''
          if gh release download nightly --pattern latest.json --output previous.json; then
            previous=$(python3 -c "import json;print(json.load(open('previous.json')).get('commit',''))")
          fi

          # Subject and body per commit, record-separated, because a merge commit's
          # subject is "Merge pull request #37 from ..." and its body's first line is
          # the pull request title -- which is the line worth showing.
          log_format='%s%x1f%b%x1e'

          if [ -n "$previous" ] && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            git log --first-parent --format="$log_format" "$previous..$GITHUB_SHA" > changes.txt
          else
            # No previous document, or a commit no longer in this history (a force
            # push, a rebuilt workflow). One entry is honest; a fabricated list is not.
            git log --first-parent --format="$log_format" -1 "$GITHUB_SHA" > changes.txt
          fi

          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER)) \
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts) \
          python3 - <<'PY' > latest.json
          import json
          import os

          def headline(subject, body):
              """What this commit says it did, in one line."""
              if subject.startswith('Merge pull request') or subject.startswith('Merge branch'):
                  # The pull request's title, which is what the merge is called
                  # everywhere a person reads it.
                  for line in body.splitlines():
                      if line.strip():
                          return line.strip()
                  return ''
              return subject.strip()

          changes = []
          for record in open('changes.txt').read().split('\x1e'):
              if not record.strip():
                  continue
              subject, _, body = record.strip('\n').partition('\x1f')
              line = headline(subject, body)
              if line and line not in changes:
                  changes.append(line)

          print(json.dumps({
              'version_code': int(os.environ['VERSION_CODE']),
              'version_name': os.environ['VERSION_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'apk_url': (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}"
                  '/releases/download/nightly/wardrobapp.apk'
              ),
              # Bounded: the document is fetched by every phone at every launch, and
              # nobody reads the fiftieth line of a changelog.
              'changes': changes[:50],
          }, indent=2))
          PY

          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly wardrobapp.apk latest.json \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --prerelease \
            --notes-file release-notes.md
